{%- assign article_lang = page.lang | default: "en" -%}
{%- assign article_description = page.description | default: site.description -%}
{%- assign article_author = page.author | default: "K. Ford" -%}
<meta name="description" content="{{ article_description | escape }}">
<meta name="author" content="{{ article_author | escape }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}">
<link rel="alternate" hreflang="ko" href="{{ '/kr.html' | absolute_url }}">
<link rel="alternate" hreflang="ja" href="{{ '/jp.html' | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ article_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:locale"
  content="{% if article_lang == 'ko' %}ko_KR{% elsif article_lang == 'ja' %}ja_JP{% else %}en_US{% endif %}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ article_description | escape }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": {{ page.title | jsonify }},
  "description": {{ article_description | jsonify }},
  "author": { "@type": "Person", "name": {{ article_author | jsonify }} },
  "inLanguage": {{ article_lang | jsonify }},
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ page.url | absolute_url | jsonify }} }
}
</script>
